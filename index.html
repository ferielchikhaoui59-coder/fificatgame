<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Midnight Familiar — guide a winged black cat through a haunted graveyard in this gothic Halloween arcade game.">
  <meta name="theme-color" content="#100d16">
  <meta property="og:title" content="Midnight Familiar">
  <meta property="og:description" content="Guide a winged black cat through a haunted graveyard. A gothic Halloween arcade game.">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Midnight Familiar</title>
  <style>
    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background:
        radial-gradient(ellipse at 50% 30%, #2a1b30 0%, #100d16 60%, #08060b 100%);
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: min(100%, 420px, calc((100vh - 32px) * 0.65625));
      aspect-ratio: 420 / 640;
      height: auto;
      border: 1px solid #674354;
      border-radius: 12px;
      box-shadow:
        0 0 0 4px #1a121f,
        0 0 0 5px #3d2836,
        0 24px 70px #000c,
        0 0 90px #8c3c5022;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Midnight Familiar game"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const W = 420;
    const H = 640;
    const groundY = 565;

    const GRAVITY = 1350;
    const FLAP_VELOCITY = -430;
    const SPEED = 138;
    const PILLAR_W = 62;
    const GAP = 188;
    const TAU = Math.PI * 2;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;

    const MENU_BUTTON = { x: 120, y: 372, w: 180, h: 46 };
    const OVER_BUTTON = { x: 120, y: 372, w: 180, h: 46 };
    const PAUSE_BUTTON = { x: W - 50, y: 18, w: 32, h: 32 };

    let cat;
    let pillars;
    let particles = [];
    let score = 0;
    let best = loadBest();
    let newBest = false;
    let state = "menu";
    let spawnTimer = 1.1;
    let lastTime = 0;
    let gameTime = 0;
    let worldTime = 0;
    let scrollX = 0;
    let overTime = 0;
    let shake = 0;
    let flash = 0;
    let scorePop = 0;
    let shootingStar = null;
    let shootTimer = 3;
    const pointer = { x: -1, y: -1, inside: false };

    // ---------- Helpers ----------

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const mod = (a, n) => ((a % n) + n) % n;

    function mulberry32(seed) {
      return function () {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function setSpacing(px) {
      if ("letterSpacing" in ctx) ctx.letterSpacing = px + "px";
    }

    function inRect(p, r) {
      return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
    }

    // ---------- Static scenery data ----------

    const rng = mulberry32(1337);

    const STARS = Array.from({ length: 130 }, () => ({
      x: rng() * W,
      y: rng() * 340,
      r: 0.3 + rng() * 1.3,
      phase: rng() * TAU,
      speed: 0.6 + rng() * 2.2,
      warm: rng() < 0.2
    }));

    const TUFTS = Array.from({ length: 36 }, () => ({
      x: rng() * 420,
      h: 5 + rng() * 9,
      lean: (rng() - 0.5) * 5
    }));

    const PEBBLES = Array.from({ length: 30 }, () => ({
      x: rng() * 420,
      y: groundY + 16 + rng() * (H - groundY - 22),
      r: 1 + rng() * 2.4
    }));

    const FIREFLIES = Array.from({ length: 14 }, () => ({
      x: rng() * W,
      y: rng(),
      speed: 0.5 + rng(),
      phase: rng() * TAU
    }));

    const GRAVES = [
      { x: 30, type: "round", w: 20, h: 32, tilt: -0.06 },
      { x: 88, type: "cross", w: 18, h: 40, tilt: 0.08 },
      { x: 160, type: "obelisk", w: 14, h: 56, tilt: 0 },
      { x: 228, type: "round", w: 26, h: 40, tilt: 0.04, candle: true },
      { x: 300, type: "cross", w: 16, h: 32, tilt: -0.1 },
      { x: 372, type: "round", w: 18, h: 28, tilt: 0.1 },
      { x: 440, type: "obelisk", w: 12, h: 44, tilt: -0.03, candle: true }
    ];
    const GRAVE_PERIOD = 500;

    const TREES = [
      { x: 150, scale: 1.0, seed: 11 },
      { x: 390, scale: 0.75, seed: 29 },
      { x: 560, scale: 1.15, seed: 47 }
    ];
    const TREE_PERIOD = 640;

    const LAYERS = {
      mountains: { base: 330, factor: 0.03, sharp: true, waves: [[46, 0.009, 0.3], [18, 0.023, 1.1]] },
      hills1: { base: 384, factor: 0.16, waves: [[16, 0.011, 0], [7, 0.027, 2]] },
      hills2: { base: 438, factor: 0.28, waves: [[14, 0.008, 1], [6, 0.021, 0.4]] },
      mound: { base: 532, factor: 0.45, waves: [[5, 0.018, 0.5], [3, 0.047, 2]] }
    };

    // ---------- Audio (all synthesized with Web Audio, no files) ----------

    const MUTE_BUTTON = { x: 18, y: 18, w: 32, h: 32 };

    const sound = {
      ctx: null,
      master: null,
      music: null,
      musicFilter: null,
      sfx: null,
      noiseBuffer: null,
      muted: loadMuted(),
      step: 0,
      nextTime: 0,
      mood: null,
      lastTheremin: null
    };

    const BPM = 132;
    const STEP = 60 / BPM / 2; // eighth notes, 6 per bar (3/4 waltz)

    // A creepy waltz in D harmonic minor: Dm, Gm, Dm, A, Bb, Gm, Dm, A.
    const BASS = [38, 43, 38, 45, 46, 43, 38, 45];
    const CHORDS = [
      [62, 65, 69], [62, 67, 70], [62, 65, 69], [61, 64, 69],
      [62, 65, 70], [62, 67, 70], [62, 65, 69], [61, 64, 69]
    ];
    // [beat, midi note, length in eighths]
    const MELODY = [
      [[0, 74, 2], [2, 77, 1], [3, 76, 1], [4, 74, 2]],
      [[0, 79, 2], [2, 77, 1], [3, 74, 1], [4, 70, 2]],
      [[0, 69, 2], [2, 74, 2], [4, 77, 2]],
      [[0, 76, 3], [3, 73, 3]],
      [[0, 77, 2], [2, 79, 1], [3, 77, 1], [4, 74, 2]],
      [[0, 82, 2], [2, 81, 1], [3, 79, 1], [4, 77, 2]],
      [[0, 76, 1], [1, 77, 1], [2, 74, 2], [4, 69, 2]],
      [[0, 76, 2], [2, 73, 2], [4, 69, 2]]
    ];

    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

    function loadMuted() {
      try {
        return localStorage.getItem("midnightFamiliarMuted") === "1";
      } catch {
        return false;
      }
    }

    function initAudio() {
      if (sound.ctx) {
        if (sound.ctx.state === "suspended" && !document.hidden) sound.ctx.resume();
        return;
      }

      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;

      const ac = new AC();
      sound.ctx = ac;

      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -18;
      comp.ratio.value = 4;
      comp.connect(ac.destination);

      sound.master = ac.createGain();
      sound.master.gain.value = sound.muted ? 0 : 0.8;
      sound.master.connect(comp);

      // Cathedral-ish reverb from a generated impulse.
      const reverb = ac.createConvolver();
      reverb.buffer = makeImpulse(ac, 3, 2.4);
      const wet = ac.createGain();
      wet.gain.value = 0.4;
      reverb.connect(wet);
      wet.connect(sound.master);

      sound.musicFilter = ac.createBiquadFilter();
      sound.musicFilter.type = "lowpass";
      sound.musicFilter.frequency.value = 18000;
      sound.musicFilter.connect(sound.master);
      sound.musicFilter.connect(reverb);

      sound.music = ac.createGain();
      sound.music.gain.value = 0.55;
      sound.music.connect(sound.musicFilter);

      sound.sfx = ac.createGain();
      sound.sfx.gain.value = 0.7;
      sound.sfx.connect(sound.master);
      const sfxSend = ac.createGain();
      sfxSend.gain.value = 0.25;
      sound.sfx.connect(sfxSend);
      sfxSend.connect(reverb);

      const len = ac.sampleRate * 2;
      sound.noiseBuffer = ac.createBuffer(1, len, ac.sampleRate);
      const data = sound.noiseBuffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

      startAmbience();

      sound.nextTime = ac.currentTime + 0.15;
      setInterval(scheduleMusic, 25);
    }

    function makeImpulse(ac, seconds, decay) {
      const len = ac.sampleRate * seconds;
      const buffer = ac.createBuffer(2, len, ac.sampleRate);
      for (let c = 0; c < 2; c++) {
        const d = buffer.getChannelData(c);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
      return buffer;
    }

    function toggleMute() {
      sound.muted = !sound.muted;
      try {
        localStorage.setItem("midnightFamiliarMuted", sound.muted ? "1" : "0");
      } catch {
        // Ignore storage failures.
      }
      if (sound.master) {
        sound.master.gain.setTargetAtTime(sound.muted ? 0 : 0.8, sound.ctx.currentTime, 0.05);
      }
    }

    function setMood(mood) {
      if (!sound.ctx || sound.mood === mood) return;
      sound.mood = mood;
      const now = sound.ctx.currentTime;
      const cutoff = mood === "over" ? 650 : mood === "paused" ? 900 : 18000;
      const level = mood === "paused" ? 0.25 : 0.55;
      sound.musicFilter.frequency.setTargetAtTime(cutoff, now, 0.25);
      sound.music.gain.setTargetAtTime(level, now, 0.25);
    }

    // Wind howling through the graveyard plus a low, slowly breathing drone.
    function startAmbience() {
      const ac = sound.ctx;

      const wind = ac.createBufferSource();
      wind.buffer = sound.noiseBuffer;
      wind.loop = true;
      const windFilter = ac.createBiquadFilter();
      windFilter.type = "bandpass";
      windFilter.frequency.value = 500;
      windFilter.Q.value = 2.5;
      const windGain = ac.createGain();
      windGain.gain.value = 0.07;

      const windLfo = ac.createOscillator();
      windLfo.frequency.value = 0.09;
      const windLfoAmt = ac.createGain();
      windLfoAmt.gain.value = 320;
      windLfo.connect(windLfoAmt);
      windLfoAmt.connect(windFilter.frequency);

      const gustLfo = ac.createOscillator();
      gustLfo.frequency.value = 0.13;
      const gustAmt = ac.createGain();
      gustAmt.gain.value = 0.04;
      gustLfo.connect(gustAmt);
      gustAmt.connect(windGain.gain);

      wind.connect(windFilter);
      windFilter.connect(windGain);
      windGain.connect(sound.master);
      wind.start();
      windLfo.start();
      gustLfo.start();

      const droneFilter = ac.createBiquadFilter();
      droneFilter.type = "lowpass";
      droneFilter.frequency.value = 260;
      const droneGain = ac.createGain();
      droneGain.gain.value = 0.045;
      droneFilter.connect(droneGain);
      droneGain.connect(sound.music);

      for (const [freq, detune] of [[mtof(38), -6], [mtof(38), 7], [mtof(45), 0]]) {
        const o = ac.createOscillator();
        o.type = "sawtooth";
        o.frequency.value = freq;
        o.detune.value = detune;
        o.connect(droneFilter);
        o.start();
      }

      const droneLfo = ac.createOscillator();
      droneLfo.frequency.value = 0.07;
      const droneLfoAmt = ac.createGain();
      droneLfoAmt.gain.value = 120;
      droneLfo.connect(droneLfoAmt);
      droneLfoAmt.connect(droneFilter.frequency);
      droneLfo.start();
    }

    function envelope(gain, t, attack, peak, decay) {
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(peak, t + attack);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    }

    function tone(type, freq, t, decay, peak, dest, attack = 0.005) {
      const ac = sound.ctx;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      envelope(g, t, attack, peak, decay);
      o.connect(g);
      g.connect(dest);
      o.start(t);
      o.stop(t + attack + decay + 0.05);
      return o;
    }

    function noiseBurst(t, dur, type, freq, q, peak, dest) {
      const ac = sound.ctx;
      const src = ac.createBufferSource();
      src.buffer = sound.noiseBuffer;
      const f = ac.createBiquadFilter();
      f.type = type;
      f.frequency.setValueAtTime(freq, t);
      f.Q.value = q;
      const g = ac.createGain();
      envelope(g, t, 0.003, peak, dur);
      src.connect(f);
      f.connect(g);
      g.connect(dest);
      src.start(t, Math.random() * 1.5);
      src.stop(t + dur + 0.05);
      return f;
    }

    // ----- Instruments -----

    function musicBox(note, t, dest = sound.music, peak = 0.11) {
      const f = mtof(note);
      tone("sine", f, t, 1.3, peak, dest);
      tone("sine", f * 2, t, 0.5, peak * 0.35, dest);
      tone("triangle", f * 3.01, t, 0.15, peak * 0.12, dest);
    }

    function theremin(note, t, len) {
      const ac = sound.ctx;
      const f = mtof(note);
      const from = sound.lastTheremin || f;
      sound.lastTheremin = f;

      const o = ac.createOscillator();
      o.type = "sine";
      o.frequency.setValueAtTime(from, t);
      o.frequency.exponentialRampToValueAtTime(f, t + 0.09);

      const vib = ac.createOscillator();
      vib.frequency.value = 5.5;
      const vibAmt = ac.createGain();
      vibAmt.gain.value = f * 0.014;
      vib.connect(vibAmt);
      vibAmt.connect(o.frequency);

      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.085, t + 0.08);
      g.gain.setValueAtTime(0.085, t + len * 0.85);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len + 0.3);

      o.connect(g);
      g.connect(sound.music);
      o.start(t);
      vib.start(t);
      o.stop(t + len + 0.35);
      vib.stop(t + len + 0.35);
    }

    function bass(note, t, len) {
      const ac = sound.ctx;
      const f = ac.createBiquadFilter();
      f.type = "lowpass";
      f.frequency.value = 420;
      f.connect(sound.music);
      for (const type of ["triangle", "sawtooth"]) {
        const o = tone(type, mtof(note), t, len, type === "triangle" ? 0.2 : 0.06, f, 0.01);
        o.detune.value = type === "sawtooth" ? 5 : 0;
      }
    }

    function organ(chord, t, len) {
      const ac = sound.ctx;
      const f = ac.createBiquadFilter();
      f.type = "lowpass";
      f.frequency.value = 2200;
      f.connect(sound.music);
      for (const note of chord) {
        const freq = mtof(note);
        tone("sine", freq, t, len, 0.03, f, 0.015);
        tone("sine", freq * 2, t, len, 0.014, f, 0.015);
        tone("square", freq * 0.5, t, len * 0.7, 0.006, f, 0.015);
      }
    }

    function bell(freq, t, dest = sound.music, peak = 0.08) {
      const partials = [[0.5, 1], [1, 0.8], [1.19, 0.5], [1.56, 0.35], [2, 0.3], [2.51, 0.2], [2.66, 0.15], [3.01, 0.1]];
      for (const [ratio, amp] of partials) {
        tone("sine", freq * ratio, t, 3.5 / ratio + 0.6, peak * amp, dest, 0.004);
      }
    }

    function tom(t) {
      const ac = sound.ctx;
      const o = ac.createOscillator();
      o.type = "sine";
      o.frequency.setValueAtTime(120, t);
      o.frequency.exponentialRampToValueAtTime(48, t + 0.25);
      const g = ac.createGain();
      envelope(g, t, 0.005, 0.22, 0.3);
      o.connect(g);
      g.connect(sound.music);
      o.start(t);
      o.stop(t + 0.4);
    }

    function tick(t, accent) {
      noiseBurst(t, 0.03, "highpass", accent ? 2500 : 4000, 1, accent ? 0.05 : 0.03, sound.music);
    }

    // ----- Sequencer -----

    function scheduleMusic() {
      const ac = sound.ctx;
      if (!ac || ac.state !== "running") return;

      // Don't burst-play missed notes after the tab was throttled.
      if (sound.nextTime < ac.currentTime - 0.2) sound.nextTime = ac.currentTime + 0.05;

      while (sound.nextTime < ac.currentTime + 0.12) {
        playStep(sound.step, sound.nextTime);
        sound.nextTime += STEP;
        sound.step++;
      }
    }

    function playStep(step, t) {
      const bar = Math.floor(step / 6) % 8;
      const beat = step % 6;
      const pass = Math.floor(step / 48);

      // Oom-pah-pah: bass on the downbeat, organ stabs on beats two and three.
      if (beat === 0) bass(BASS[bar], t, STEP * 3.5);
      if (beat === 2 || beat === 4) organ(CHORDS[bar], t, STEP * 1.4);

      // Melody alternates between a music box and a ghostly theremin.
      for (const [b, note, len] of MELODY[bar]) {
        if (b !== beat) continue;
        if (pass % 2 === 0) {
          musicBox(note, t);
        } else {
          theremin(note - 12, t, len * STEP);
          if (len >= 2) musicBox(note + 12, t, sound.music, 0.035);
        }
      }

      // Clock ticks and a heartbeat tom while flying.
      if (state === "playing") {
        if (beat % 2 === 0) tick(t, beat === 0);
        if (beat === 0) tom(t);
        if (beat === 1 && bar % 2 === 1) tom(t);
      }

      // Distant church bell every other pass.
      if (step % 96 === 0) bell(mtof(50), t);
    }

    // ----- Sound effects -----

    function sfxFlap() {
      if (!sound.ctx) return;
      const t = sound.ctx.currentTime;
      const f = noiseBurst(t, 0.14, "bandpass", 600, 1.2, 0.09, sound.sfx);
      f.frequency.exponentialRampToValueAtTime(1800, t + 0.12);
      tone("sine", 180, t, 0.08, 0.05, sound.sfx);
    }

    function sfxScore() {
      if (!sound.ctx) return;
      const t = sound.ctx.currentTime;
      musicBox(81, t, sound.sfx, 0.09);
      musicBox(86, t + 0.08, sound.sfx, 0.09);
    }

    function sfxThud(strength = 1) {
      if (!sound.ctx) return;
      const ac = sound.ctx;
      const t = ac.currentTime;
      const o = ac.createOscillator();
      o.frequency.setValueAtTime(90, t);
      o.frequency.exponentialRampToValueAtTime(38, t + 0.25);
      const g = ac.createGain();
      envelope(g, t, 0.005, 0.35 * strength, 0.3);
      o.connect(g);
      g.connect(sound.sfx);
      o.start(t);
      o.stop(t + 0.4);
      noiseBurst(t, 0.15, "lowpass", 500, 0.7, 0.15 * strength, sound.sfx);
    }

    function sfxMeow(t) {
      const ac = sound.ctx;
      const o = ac.createOscillator();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(430, t);
      o.frequency.linearRampToValueAtTime(740, t + 0.18);
      o.frequency.linearRampToValueAtTime(580, t + 0.45);
      o.frequency.linearRampToValueAtTime(380, t + 0.7);

      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.16, t + 0.06);
      g.gain.setValueAtTime(0.16, t + 0.4);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.75);
      g.connect(sound.sfx);

      // Two sweeping formants shape the "mee-ow" vowel.
      const formants = [
        [[500, 0], [1100, 0.18], [900, 0.45], [550, 0.7]],
        [[1300, 0], [2500, 0.18], [1700, 0.45], [900, 0.7]]
      ];
      for (const points of formants) {
        const f = ac.createBiquadFilter();
        f.type = "bandpass";
        f.Q.value = 6;
        f.frequency.setValueAtTime(points[0][0], t);
        for (const [freq, at] of points.slice(1)) f.frequency.linearRampToValueAtTime(freq, t + at);
        o.connect(f);
        f.connect(g);
      }

      o.start(t);
      o.stop(t + 0.8);
    }

    function sfxDeath() {
      if (!sound.ctx) return;
      const t = sound.ctx.currentTime;
      sfxThud(1);
      sfxMeow(t + 0.05);

      // Sorrowful theremin falling away.
      const ac = sound.ctx;
      const o = ac.createOscillator();
      o.frequency.setValueAtTime(mtof(74), t + 0.8);
      o.frequency.exponentialRampToValueAtTime(mtof(61), t + 2.2);
      const vib = ac.createOscillator();
      vib.frequency.value = 6;
      const vibAmt = ac.createGain();
      vibAmt.gain.value = 8;
      vib.connect(vibAmt);
      vibAmt.connect(o.frequency);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t + 0.8);
      g.gain.linearRampToValueAtTime(0.08, t + 0.95);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 2.5);
      o.connect(g);
      g.connect(sound.sfx);
      o.start(t + 0.8);
      vib.start(t + 0.8);
      o.stop(t + 2.6);
      vib.stop(t + 2.6);
    }

    function sfxStart() {
      if (!sound.ctx) return;
      const t = sound.ctx.currentTime;
      [62, 65, 69, 74].forEach((n, i) => musicBox(n + 12, t + i * 0.06, sound.sfx, 0.06));
    }

    // ---------- Storage ----------

    function loadBest() {
      try {
        return Number(localStorage.getItem("midnightFamiliarBest")) || 0;
      } catch {
        return 0;
      }
    }

    function saveBest(value) {
      try {
        localStorage.setItem("midnightFamiliarBest", value);
      } catch {
        // The game works even when browser storage is unavailable.
      }
    }

    // ---------- Game flow ----------

    function resetGame() {
      cat = { x: 112, y: 300, velocity: 0, flapT: 1, spin: 0, landed: false };
      pillars = [];
      particles = [];
      score = 0;
      newBest = false;
      spawnTimer = 1.1;
      gameTime = 0;
      overTime = 0;
      scorePop = 0;
    }

    function startGame() {
      resetGame();
      state = "playing";
      sfxStart();
      flap();
    }

    function flap() {
      cat.velocity = FLAP_VELOCITY;
      cat.flapT = 0;
      sfxFlap();

      for (let i = 0; i < 7; i++) {
        particles.push({
          x: cat.x - 12,
          y: cat.y + 4,
          vx: -40 - Math.random() * 90,
          vy: -10 + Math.random() * 60,
          life: 0.4 + Math.random() * 0.3,
          max: 0.7,
          size: 1 + Math.random() * 2,
          color: Math.random() < 0.5 ? "#c88aa6" : "#8f6ab0"
        });
      }
    }

    function endGame() {
      if (state !== "playing") return;

      state = "over";
      overTime = 0;
      shake = 0.45;
      flash = 1;
      cat.spin = clamp(cat.velocity / 900, -0.42, 0.58);
      cat.velocity = -260;
      cat.landed = false;
      sfxDeath();

      if (score > best) {
        best = score;
        newBest = true;
        saveBest(best);
      }
    }

    function togglePause() {
      if (state === "playing") state = "paused";
      else if (state === "paused") state = "playing";
    }

    function press(point) {
      initAudio();

      if (point && inRect(point, MUTE_BUTTON)) {
        toggleMute();
        return;
      }

      if (state === "menu") {
        startGame();
      } else if (state === "paused") {
        state = "playing";
      } else if (state === "over") {
        if (overTime > 0.8) startGame();
      } else if (state === "playing") {
        if (point && inRect(point, PAUSE_BUTTON)) {
          state = "paused";
          return;
        }
        flap();
      }
    }

    function canvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * (W / rect.width),
        y: (event.clientY - rect.top) * (H / rect.height)
      };
    }

    canvas.addEventListener("pointerdown", event => {
      event.preventDefault();
      press(canvasPoint(event));
    });

    canvas.addEventListener("pointermove", event => {
      const p = canvasPoint(event);
      pointer.x = p.x;
      pointer.y = p.y;
      pointer.inside = true;
    });

    canvas.addEventListener("pointerleave", () => {
      pointer.inside = false;
    });

    window.addEventListener("keydown", event => {
      if (event.code === "KeyM") {
        initAudio();
        toggleMute();
        return;
      }

      if (event.code === "KeyP" || event.code === "Escape") {
        event.preventDefault();
        togglePause();
        return;
      }

      if (event.code !== "Space" && event.code !== "ArrowUp" && event.code !== "KeyW") return;

      event.preventDefault();
      if (event.repeat) return;
      press(null);
    });

    window.addEventListener("pointerdown", () => initAudio());

    window.addEventListener("blur", () => {
      if (state === "playing") state = "paused";
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && state === "playing") state = "paused";
      if (!sound.ctx) return;
      if (document.hidden) sound.ctx.suspend();
      else sound.ctx.resume();
    });

    function addPillarPair() {
      const minTop = 72;
      const maxTop = groundY - GAP - 65;
      const top = minTop + Math.random() * (maxTop - minTop);

      pillars.push({
        x: W + 28,
        top,
        gap: GAP,
        passed: false,
        ivy: Math.random() < 0.55,
        ivyHeight: 40 + Math.random() * 70,
        seed: (Math.random() * 1e9) | 0
      });
    }

    function hitsPillar(pillar) {
      const catLeft = cat.x - 21;
      const catRight = cat.x + 22;
      const catTop = cat.y - 15;
      const catBottom = cat.y + 15;

      const overlapsX = catRight > pillar.x && catLeft < pillar.x + PILLAR_W;
      const hitsUpper = catTop < pillar.top;
      const hitsLower = catBottom > pillar.top + pillar.gap;

      return overlapsX && (hitsUpper || hitsLower);
    }

    // ---------- Update ----------

    function update(dt) {
      if (state === "paused") return;

      worldTime += dt;
      shake = Math.max(0, shake - dt);
      flash = Math.max(0, flash - dt * 3);
      scorePop = Math.max(0, scorePop - dt * 4);

      shootTimer -= dt;
      if (shootTimer <= 0) {
        shootingStar = { x: 30 + Math.random() * 230, y: 25 + Math.random() * 120, t: 0 };
        shootTimer = 5 + Math.random() * 7;
      }
      if (shootingStar) {
        shootingStar.t += dt;
        if (shootingStar.t > 0.8) shootingStar = null;
      }

      for (const p of particles) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 60 * dt;
        p.life -= dt;
      }
      particles = particles.filter(p => p.life > 0);

      if (state === "menu") {
        scrollX += SPEED * 0.5 * dt;
        return;
      }

      if (state === "over") {
        overTime += dt;
        if (!cat.landed) {
          cat.velocity += GRAVITY * dt;
          cat.y += cat.velocity * dt;
          cat.spin += (Math.PI - cat.spin) * Math.min(1, dt * 5);
          if (cat.y + 28 >= groundY) {
            cat.y = groundY - 28;
            cat.spin = Math.PI;
            cat.landed = true;
            shake = Math.max(shake, 0.15);
            sfxThud(0.5);
          }
        }
        return;
      }

      // Playing
      gameTime += dt;
      scrollX += SPEED * dt;
      cat.flapT += dt;
      cat.velocity += GRAVITY * dt;
      cat.y += cat.velocity * dt;

      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        addPillarPair();
        spawnTimer = 1.65;
      }

      for (const pillar of pillars) {
        pillar.x -= SPEED * dt;

        if (!pillar.passed && pillar.x + PILLAR_W < cat.x) {
          pillar.passed = true;
          score++;
          scorePop = 1;
          sfxScore();
          for (let i = 0; i < 8; i++) {
            particles.push({
              x: cat.x + 6,
              y: cat.y - 8,
              vx: -30 + Math.random() * 60,
              vy: -90 + Math.random() * 50,
              life: 0.5 + Math.random() * 0.3,
              max: 0.8,
              size: 1 + Math.random() * 1.8,
              color: "#f2c46b"
            });
          }
        }

        if (hitsPillar(pillar)) {
          endGame();
        }
      }

      pillars = pillars.filter(pillar => pillar.x > -85);

      if (cat.y - 16 < 0 || cat.y + 16 > groundY) {
        endGame();
      }
    }

    // ---------- Drawing primitives ----------

    function roundedRect(x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);

      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + width - r, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + r);
      ctx.lineTo(x + width, y + height - r);
      ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      ctx.lineTo(x + r, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function diamond(x, y, size) {
      ctx.beginPath();
      ctx.moveTo(x, y - size);
      ctx.lineTo(x + size, y);
      ctx.lineTo(x, y + size);
      ctx.lineTo(x - size, y);
      ctx.closePath();
      ctx.fill();
    }

    function ridgeY(layer, sx) {
      const wx = sx + scrollX * layer.factor;
      let y = layer.base;
      for (const [a, f, p] of layer.waves) {
        y -= layer.sharp
          ? a * (1 - Math.abs(Math.sin(wx * f + p)))
          : a * Math.sin(wx * f + p);
      }
      return y;
    }

    function drawRidge(layer, fill, rimAlpha) {
      ctx.fillStyle = fill;
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (let x = 0; x <= W + 6; x += 6) ctx.lineTo(x, ridgeY(layer, x));
      ctx.lineTo(W + 6, H);
      ctx.closePath();
      ctx.fill();

      if (rimAlpha) {
        ctx.strokeStyle = `rgba(200, 110, 130, ${rimAlpha})`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(0, ridgeY(layer, 0));
        for (let x = 6; x <= W + 6; x += 6) ctx.lineTo(x, ridgeY(layer, x));
        ctx.stroke();
      }
    }

    // ---------- Background ----------

    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, "#0c0916");
      sky.addColorStop(0.35, "#1c1430");
      sky.addColorStop(0.62, "#382139");
      sky.addColorStop(0.85, "#56313e");
      sky.addColorStop(1, "#3a2430");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      // Faint nebula wash.
      ctx.save();
      ctx.globalAlpha = 0.35;
      const neb = ctx.createRadialGradient(110, 150, 10, 110, 150, 190);
      neb.addColorStop(0, "#5a3a7a");
      neb.addColorStop(1, "#5a3a7a00");
      ctx.fillStyle = neb;
      ctx.fillRect(0, 0, W, 360);
      ctx.restore();

      drawStars();
      drawShootingStar();
      drawMoon();
      drawClouds();

      drawRidge(LAYERS.mountains, "#2a2136", 0.18);
      drawCastle();
      drawBats();

      drawRidge(LAYERS.hills1, "#211a2a", 0.14);
      drawTrees();
      drawMist(400, 0.1, 0);

      drawRidge(LAYERS.hills2, "#1c1624", 0.12);
      drawMist(470, 0.12, 2);

      drawGraves();
      drawRidge(LAYERS.mound, "#18121e", 0.1);
      drawFireflies();
    }

    function drawStars() {
      for (const s of STARS) {
        const tw = 0.55 + Math.sin(worldTime * s.speed + s.phase) * 0.35;
        ctx.globalAlpha = clamp(tw, 0.1, 1) * (1 - s.y / 420);
        ctx.fillStyle = s.warm ? "#f3c9a8" : "#e8e0f0";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, TAU);
        ctx.fill();

        // A few bright stars get a little cross glint.
        if (s.r > 1.45) {
          ctx.strokeStyle = ctx.fillStyle;
          ctx.globalAlpha *= 0.5;
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(s.x - 4, s.y);
          ctx.lineTo(s.x + 4, s.y);
          ctx.moveTo(s.x, s.y - 4);
          ctx.lineTo(s.x, s.y + 4);
          ctx.stroke();
        }
      }
      ctx.globalAlpha = 1;
    }

    function drawShootingStar() {
      if (!shootingStar) return;
      const p = shootingStar.t / 0.8;
      const hx = shootingStar.x + p * 150;
      const hy = shootingStar.y + p * 60;
      const grad = ctx.createLinearGradient(hx - 55, hy - 22, hx, hy);
      grad.addColorStop(0, "rgba(255,230,220,0)");
      grad.addColorStop(1, `rgba(255,230,220,${0.9 * (1 - p)})`);
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(hx - 55, hy - 22);
      ctx.lineTo(hx, hy);
      ctx.stroke();
    }

    function drawMoon() {
      const mx = 316;
      const my = 118;
      const r = 40;

      ctx.save();

      const halo = ctx.createRadialGradient(mx, my, r * 0.8, mx, my, r * 4);
      halo.addColorStop(0, "rgba(210, 100, 110, 0.32)");
      halo.addColorStop(0.4, "rgba(170, 70, 100, 0.12)");
      halo.addColorStop(1, "rgba(170, 70, 100, 0)");
      ctx.fillStyle = halo;
      ctx.fillRect(mx - r * 4, my - r * 4, r * 8, r * 8);

      const body = ctx.createRadialGradient(mx - 14, my - 14, 4, mx, my, r);
      body.addColorStop(0, "#f2b9a0");
      body.addColorStop(0.55, "#c66a6b");
      body.addColorStop(1, "#8a3a4c");
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.arc(mx, my, r, 0, TAU);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(mx, my, r, 0, TAU);
      ctx.clip();

      // Maria and craters.
      ctx.fillStyle = "rgba(120, 40, 60, 0.28)";
      ctx.beginPath();
      ctx.ellipse(mx - 8, my - 6, 15, 10, 0.4, 0, TAU);
      ctx.ellipse(mx + 14, my + 12, 11, 8, -0.3, 0, TAU);
      ctx.fill();

      const craters = [[mx - 18, my + 14, 5], [mx + 6, my - 20, 4], [mx + 22, my - 4, 3], [mx - 4, my + 24, 3.5], [mx - 24, my - 12, 2.5]];
      for (const [cx, cy, cr] of craters) {
        ctx.fillStyle = "rgba(110, 35, 55, 0.4)";
        ctx.beginPath();
        ctx.arc(cx, cy, cr, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = "rgba(255, 200, 180, 0.25)";
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.arc(cx, cy, cr, Math.PI * 0.1, Math.PI * 0.9);
        ctx.stroke();
      }

      // Terminator shadow.
      ctx.fillStyle = "rgba(30, 10, 25, 0.35)";
      ctx.beginPath();
      ctx.arc(mx + 22, my + 10, r, 0, TAU);
      ctx.fill();

      ctx.restore();
    }

    function drawClouds() {
      for (let i = 0; i < 4; i++) {
        const x = mod(worldTime * (5 + i * 2) + i * 210, W + 300) - 150;
        const y = 70 + i * 42;
        const s = 0.8 + (i % 2) * 0.4;

        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s, s);

        ctx.fillStyle = "rgba(24, 16, 34, 0.72)";
        ctx.beginPath();
        ctx.ellipse(0, 0, 60, 9, 0, 0, TAU);
        ctx.ellipse(-22, -5, 26, 9, 0, 0, TAU);
        ctx.ellipse(18, -6, 30, 10, 0, 0, TAU);
        ctx.ellipse(46, 1, 24, 6, 0, 0, TAU);
        ctx.fill();

        ctx.strokeStyle = "rgba(220, 120, 130, 0.18)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(18, -6, 30, 10, 0, Math.PI * 1.15, Math.PI * 1.85);
        ctx.stroke();

        ctx.restore();
      }
    }

    function drawCastle() {
      const period = 900;
      const ox = 30 - mod(scrollX * 0.08, period);

      for (const base of [ox, ox + period]) {
        if (base + 200 < 0 || base > W) continue;
        ctx.save();
        ctx.translate(base, 0);
        drawCastleAt();
        ctx.restore();
      }
    }

    function drawCastleAt() {
      const stone = "#1b1524";
      ctx.fillStyle = stone;

      // Left tower.
      ctx.fillRect(10, 222, 30, 170);
      ctx.beginPath();
      ctx.moveTo(4, 225);
      ctx.lineTo(25, 176);
      ctx.lineTo(46, 225);
      ctx.closePath();
      ctx.fill();

      // Keep.
      ctx.fillRect(36, 250, 108, 140);
      for (let bx = 36; bx < 144; bx += 12) ctx.fillRect(bx, 242, 7, 9);

      // Central tower with spire.
      ctx.fillRect(72, 196, 36, 60);
      for (let bx = 70; bx < 110; bx += 10) ctx.fillRect(bx, 190, 6, 8);
      ctx.beginPath();
      ctx.moveTo(68, 192);
      ctx.lineTo(90, 132);
      ctx.lineTo(112, 192);
      ctx.closePath();
      ctx.fill();

      // Right tower.
      ctx.fillRect(138, 232, 28, 160);
      ctx.beginPath();
      ctx.moveTo(132, 235);
      ctx.lineTo(152, 192);
      ctx.lineTo(172, 235);
      ctx.closePath();
      ctx.fill();

      // Small buttress turret.
      ctx.fillRect(166, 300, 16, 90);
      ctx.beginPath();
      ctx.moveTo(163, 302);
      ctx.lineTo(174, 282);
      ctx.lineTo(185, 302);
      ctx.closePath();
      ctx.fill();

      // Spire poles and flag.
      ctx.strokeStyle = stone;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(90, 132);
      ctx.lineTo(90, 116);
      ctx.moveTo(25, 176);
      ctx.lineTo(25, 168);
      ctx.moveTo(152, 192);
      ctx.lineTo(152, 184);
      ctx.stroke();

      ctx.fillStyle = "#7c2a40";
      ctx.beginPath();
      ctx.moveTo(90, 116);
      for (let i = 0; i <= 5; i++) {
        ctx.lineTo(90 + i * 3.6, 116 + Math.sin(worldTime * 6 - i * 0.9) * 1.6);
      }
      for (let i = 5; i >= 0; i--) {
        ctx.lineTo(90 + i * 3.6, 123 + Math.sin(worldTime * 6 - i * 0.9) * 1.6 - i * 0.3);
      }
      ctx.closePath();
      ctx.fill();

      // Roof rim light from the moon.
      ctx.strokeStyle = "rgba(210, 110, 120, 0.25)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(90, 132);
      ctx.lineTo(112, 192);
      ctx.moveTo(25, 176);
      ctx.lineTo(46, 225);
      ctx.moveTo(152, 192);
      ctx.lineTo(172, 235);
      ctx.stroke();

      // Lit arched windows with flicker.
      const windows = [
        [21, 238, 4, 10], [21, 272, 4, 10], [84, 210, 4, 11], [94, 210, 4, 11],
        [52, 272, 6, 14], [122, 272, 6, 14], [150, 250, 4, 10], [150, 290, 4, 10],
        [87, 268, 6, 14], [172, 318, 3, 8]
      ];
      windows.forEach(([wx, wy, ww, wh], i) => {
        const lit = i !== 3 && i !== 7;
        const flicker = 0.75 + Math.sin(worldTime * (2.3 + i) + i * 1.7) * 0.15 + Math.sin(worldTime * 11 + i) * 0.08;

        ctx.save();
        if (lit) {
          ctx.globalAlpha = flicker;
          ctx.shadowColor = "#ff9a5a";
          ctx.shadowBlur = 8;
          ctx.fillStyle = i % 3 === 0 ? "#f0a060" : "#d9774f";
        } else {
          ctx.fillStyle = "#0f0b14";
        }
        ctx.fillRect(wx, wy, ww, wh);
        ctx.beginPath();
        ctx.arc(wx + ww / 2, wy, ww / 2, Math.PI, 0);
        ctx.fill();
        ctx.restore();
      });

      // Gate.
      ctx.fillStyle = "#0f0b14";
      ctx.fillRect(80, 318, 20, 50);
      ctx.beginPath();
      ctx.arc(90, 318, 10, Math.PI, 0);
      ctx.fill();
      ctx.strokeStyle = "#2c2234";
      ctx.lineWidth = 1;
      for (let gx = 83; gx < 100; gx += 4) {
        ctx.beginPath();
        ctx.moveTo(gx, 312);
        ctx.lineTo(gx, 368);
        ctx.stroke();
      }
    }

    function drawBat(x, y, s, phase) {
      const f = Math.sin(phase);
      ctx.fillStyle = "#0d0a12";
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x - 5 * s, y - (4 + 5 * f) * s, x - 11 * s, y - (1 + 6 * f) * s);
      ctx.quadraticCurveTo(x - 6 * s, y + 0.5 * s, x - 2 * s, y + 1.5 * s);
      ctx.lineTo(x + 2 * s, y + 1.5 * s);
      ctx.quadraticCurveTo(x + 6 * s, y + 0.5 * s, x + 11 * s, y - (1 + 6 * f) * s);
      ctx.quadraticCurveTo(x + 5 * s, y - (4 + 5 * f) * s, x, y);
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(x, y + s, 1.8 * s, 2.6 * s, 0, 0, TAU);
      ctx.fill();
    }

    function drawBats() {
      for (let i = 0; i < 5; i++) {
        const speed = 14 + i * 5;
        const x = W + 40 - mod(worldTime * speed + i * 97, W + 80);
        const y = 160 + i * 26 + Math.sin(worldTime * 1.7 + i * 2) * 14;
        const s = 0.7 + (i % 3) * 0.25;
        drawBat(x, y, s, worldTime * (12 + i));
      }
    }

    function drawBranch(x, y, angle, length, width, depth, rand) {
      const x2 = x + Math.cos(angle) * length;
      const y2 = y + Math.sin(angle) * length;

      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      if (depth < 4) {
        drawBranch(x2, y2, angle - 0.35 + (rand() - 0.5) * 0.9, length * (0.6 + rand() * 0.18), width * 0.65, depth + 1, rand);
        drawBranch(x2, y2, angle + 0.35 + (rand() - 0.5) * 0.9, length * (0.6 + rand() * 0.18), width * 0.65, depth + 1, rand);
      }
    }

    function drawTrees() {
      const off = mod(scrollX * LAYERS.hills1.factor, TREE_PERIOD);
      ctx.strokeStyle = "#15111b";
      ctx.lineCap = "round";

      for (const tree of TREES) {
        for (const k of [0, 1]) {
          const x = tree.x - off + k * TREE_PERIOD;
          if (x < -60 || x > W + 60) continue;
          const y = ridgeY(LAYERS.hills1, x) + 4;
          drawBranch(x, y, -Math.PI / 2, 24 * tree.scale, 4 * tree.scale, 0, mulberry32(tree.seed));
        }
      }
    }

    function drawMist(y, alpha, seed) {
      ctx.save();
      ctx.globalAlpha = alpha;

      for (let i = 0; i < 3; i++) {
        const x = mod(worldTime * (8 + i * 3) + i * 155 + seed * 90, 600) - 100;
        const my = y + i * 18;

        const gradient = ctx.createLinearGradient(x - 110, my, x + 110, my);
        gradient.addColorStop(0, "#c8aabb00");
        gradient.addColorStop(0.5, "#c8aabb");
        gradient.addColorStop(1, "#c8aabb00");

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.ellipse(x, my, 110, 10 + i * 2, 0, 0, TAU);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawGrave(g, x, base) {
      ctx.save();
      ctx.translate(x + g.w / 2, base);
      ctx.rotate(g.tilt);

      const w = g.w;
      const h = g.h;
      ctx.fillStyle = "#373040";

      if (g.type === "round") {
        ctx.beginPath();
        ctx.moveTo(-w / 2, 0);
        ctx.lineTo(-w / 2, -h + w / 2);
        ctx.arc(0, -h + w / 2, w / 2, Math.PI, 0);
        ctx.lineTo(w / 2, 0);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "rgba(210, 120, 130, 0.22)";
        ctx.fillRect(w / 2 - 2, -h + w / 2, 2, h - w / 2);

        ctx.strokeStyle = "#5c5166";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, -h + 8);
        ctx.lineTo(0, -h + 20);
        ctx.moveTo(-4, -h + 12);
        ctx.lineTo(4, -h + 12);
        ctx.moveTo(-w / 2 + 4, -h + 26);
        ctx.lineTo(w / 2 - 4, -h + 26);
        ctx.stroke();
      } else if (g.type === "cross") {
        ctx.fillRect(-2.5, -h, 5, h);
        ctx.fillRect(-w / 2, -h + 8, w, 5);
        ctx.fillStyle = "rgba(210, 120, 130, 0.25)";
        ctx.fillRect(1.5, -h, 1, h);
        ctx.fillRect(-w / 2, -h + 8, w, 1);
      } else {
        ctx.beginPath();
        ctx.moveTo(-w / 2, 0);
        ctx.lineTo(-w / 2 + 2, -h + 8);
        ctx.lineTo(0, -h);
        ctx.lineTo(w / 2 - 2, -h + 8);
        ctx.lineTo(w / 2, 0);
        ctx.closePath();
        ctx.fill();
        ctx.fillRect(-w / 2 - 3, -7, w + 6, 7);
        ctx.fillStyle = "rgba(210, 120, 130, 0.22)";
        ctx.beginPath();
        ctx.moveTo(0, -h);
        ctx.lineTo(w / 2 - 2, -h + 8);
        ctx.lineTo(w / 2, 0);
        ctx.lineTo(w / 2 - 2, 0);
        ctx.lineTo(w / 2 - 4, -h + 9);
        ctx.closePath();
        ctx.fill();
      }

      ctx.restore();

      if (g.candle) {
        const cx = x + g.w + 6;
        const cy = base;
        const fl = Math.sin(worldTime * 13 + x) * 0.6 + Math.sin(worldTime * 7.3) * 0.4;

        const glow = ctx.createRadialGradient(cx, cy - 10, 1, cx, cy - 10, 22);
        glow.addColorStop(0, `rgba(255, 180, 100, ${0.35 + fl * 0.05})`);
        glow.addColorStop(1, "rgba(255, 180, 100, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(cx - 22, cy - 32, 44, 44);

        ctx.fillStyle = "#d8c6ae";
        ctx.fillRect(cx - 1.5, cy - 7, 3, 7);
        ctx.fillStyle = "#ffcf7a";
        ctx.beginPath();
        ctx.ellipse(cx + fl * 0.4, cy - 10, 1.4, 2.8 + fl * 0.4, 0, 0, TAU);
        ctx.fill();
      }
    }

    function drawGraves() {
      const off = mod(scrollX * LAYERS.mound.factor, GRAVE_PERIOD);

      for (const g of GRAVES) {
        for (const k of [0, 1]) {
          const x = g.x - off + k * GRAVE_PERIOD;
          if (x < -50 || x > W + 20) continue;
          drawGrave(g, x, ridgeY(LAYERS.mound, x + g.w / 2) + 6);
        }
      }
    }

    function drawFireflies() {
      for (const f of FIREFLIES) {
        const x = mod(f.x - scrollX * 0.6 + Math.sin(worldTime * f.speed + f.phase) * 20, W + 20) - 10;
        const y = 440 + f.y * 110 + Math.sin(worldTime * f.speed * 1.3 + f.phase) * 12;
        const a = 0.2 + 0.8 * Math.max(0, Math.sin(worldTime * f.speed * 2 + f.phase));

        const glow = ctx.createRadialGradient(x, y, 0, x, y, 9);
        glow.addColorStop(0, `rgba(255, 200, 120, ${a * 0.45})`);
        glow.addColorStop(1, "rgba(255, 200, 120, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(x - 9, y - 9, 18, 18);

        ctx.globalAlpha = a;
        ctx.fillStyle = "#ffe0a8";
        ctx.beginPath();
        ctx.arc(x, y, 1.2, 0, TAU);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    // ---------- Pillars ----------

    function drawPillar(x, y, width, height, capAtBottom, pillar) {
      if (height <= 0) return;

      const body = ctx.createLinearGradient(x, 0, x + width, 0);
      body.addColorStop(0, "#2c2533");
      body.addColorStop(0.25, "#5a4d5f");
      body.addColorStop(0.6, "#463c4f");
      body.addColorStop(1, "#28212e");
      ctx.fillStyle = body;
      ctx.fillRect(x + 4, y, width - 8, height);

      // Offset stone blocks.
      ctx.save();
      ctx.beginPath();
      ctx.rect(x + 4, y, width - 8, height);
      ctx.clip();

      ctx.strokeStyle = "rgba(18, 13, 22, 0.55)";
      ctx.lineWidth = 1;
      for (let ry = Math.floor(y / 28) * 28; ry < y + height; ry += 28) {
        ctx.beginPath();
        ctx.moveTo(x, ry);
        ctx.lineTo(x + width, ry);
        const offset = Math.round(ry / 28) % 2 ? 0 : 14;
        for (let jx = x + 4 + offset; jx < x + width; jx += 27) {
          ctx.moveTo(jx, ry);
          ctx.lineTo(jx, ry + 28);
        }
        ctx.stroke();
      }

      // Moonlit right edge.
      ctx.fillStyle = "rgba(220, 130, 140, 0.18)";
      ctx.fillRect(x + width - 9, y, 2, height);

      // Hairline cracks.
      const rand = mulberry32(pillar.seed + (capAtBottom ? 1 : 2));
      ctx.strokeStyle = "rgba(15, 10, 20, 0.6)";
      for (let i = 0; i < 2; i++) {
        let cx = x + 12 + rand() * (width - 24);
        let cy = y + rand() * height;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        for (let s = 0; s < 4; s++) {
          cx += (rand() - 0.5) * 8;
          cy += 4 + rand() * 6;
          ctx.lineTo(cx, cy);
        }
        ctx.stroke();
      }
      ctx.restore();

      // Creeping ivy on lower pillars.
      if (!capAtBottom && pillar.ivy) {
        const top = Math.max(y + 22, groundY - pillar.ivyHeight);
        ctx.strokeStyle = "#2f4034";
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(x + 12, groundY);
        for (let vy = groundY; vy > top; vy -= 4) {
          ctx.lineTo(x + 12 + Math.sin(vy * 0.15 + pillar.seed) * 4, vy);
        }
        ctx.stroke();

        ctx.fillStyle = "#3f5743";
        for (let vy = groundY - 6; vy > top; vy -= 9) {
          const vx = x + 12 + Math.sin(vy * 0.15 + pillar.seed) * 4;
          const side = Math.round(vy / 9) % 2 ? 1 : -1;
          ctx.beginPath();
          ctx.ellipse(vx + side * 3, vy, 3, 1.8, side * 0.6, 0, TAU);
          ctx.fill();
        }
      }

      const capY = capAtBottom ? y + height - 17 : y;

      // Carved cap.
      ctx.fillStyle = "#786777";
      ctx.fillRect(x, capY, width, 15);
      ctx.fillStyle = "#352c3b";
      ctx.fillRect(x, capY + 13, width, 4);
      ctx.fillStyle = "#a07b86";
      ctx.fillRect(x + 4, capY + 2, width - 8, 2);

      // Aged red inset.
      ctx.fillStyle = "#8d4553";
      ctx.fillRect(x + 20, capY + 5, width - 40, 5);

      // Small carved diamond.
      ctx.fillStyle = "#e0a487";
      diamond(x + width / 2, capY + 7.5, 3.5);
    }

    function drawPillars() {
      for (const pillar of pillars) {
        drawPillar(pillar.x, 0, PILLAR_W, pillar.top, true, pillar);

        const lowerY = pillar.top + pillar.gap;
        drawPillar(pillar.x, lowerY, PILLAR_W, groundY - lowerY, false, pillar);
      }
    }

    // ---------- Ground ----------

    function drawGround() {
      const off = mod(scrollX, 420);

      const dirt = ctx.createLinearGradient(0, groundY, 0, H);
      dirt.addColorStop(0, "#211a28");
      dirt.addColorStop(1, "#0b080f");
      ctx.fillStyle = dirt;
      ctx.fillRect(0, groundY, W, H - groundY);

      ctx.fillStyle = "#5a4656";
      ctx.fillRect(0, groundY, W, 2);
      ctx.fillStyle = "#2e2433";
      ctx.fillRect(0, groundY + 2, W, 3);

      // Pebbles and roots in the soil.
      for (const p of PEBBLES) {
        for (const k of [0, 1]) {
          const x = p.x - off + k * 420;
          if (x < -5 || x > W + 5) continue;
          ctx.fillStyle = "#2b2231";
          ctx.beginPath();
          ctx.ellipse(x, p.y, p.r * 1.4, p.r, 0, 0, TAU);
          ctx.fill();
          ctx.fillStyle = "rgba(170, 120, 140, 0.15)";
          ctx.beginPath();
          ctx.ellipse(x + p.r * 0.3, p.y - p.r * 0.4, p.r * 0.6, p.r * 0.35, 0, 0, TAU);
          ctx.fill();
        }
      }

      // Iron fence.
      const fo = mod(scrollX, 38);
      ctx.fillStyle = "#100c15";
      ctx.fillRect(0, groundY - 16, W, 3);
      ctx.fillRect(0, groundY - 6, W, 2);

      for (let x = 12 - fo; x < W + 38; x += 38) {
        ctx.fillRect(x - 1.5, groundY - 22, 3, 24);
        ctx.beginPath();
        ctx.moveTo(x - 4, groundY - 20);
        ctx.lineTo(x, groundY - 28);
        ctx.lineTo(x + 4, groundY - 20);
        ctx.closePath();
        ctx.fill();

        // Thin intermediate bar with scroll.
        ctx.fillRect(x + 18, groundY - 16, 2, 16);
        ctx.strokeStyle = "#100c15";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(x + 19, groundY - 19, 3, Math.PI * 0.5, Math.PI * 2.2);
        ctx.stroke();
      }

      // Moonlight catching the fence tips.
      ctx.fillStyle = "rgba(220, 130, 140, 0.25)";
      for (let x = 12 - fo; x < W + 38; x += 38) {
        ctx.fillRect(x + 1, groundY - 26, 1, 6);
      }

      // Grass tufts.
      ctx.lineCap = "round";
      for (const t of TUFTS) {
        for (const k of [0, 1]) {
          const x = t.x - off + k * 420;
          if (x < -8 || x > W + 8) continue;
          const sway = Math.sin(worldTime * 2 + x * 0.05) * 1.2;
          ctx.strokeStyle = "#2d2434";
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          for (const dx of [-3, 0, 3]) {
            ctx.moveTo(x + dx, groundY + 2);
            ctx.quadraticCurveTo(x + dx + t.lean * 0.4, groundY - t.h * 0.5, x + dx + t.lean + sway, groundY - t.h + Math.abs(dx));
          }
          ctx.stroke();
        }
      }
    }

    // ---------- Cat ----------

    function wingScale(t) {
      if (t < 0.1) return lerp(0.5, 1, t / 0.1);
      if (t < 0.24) return lerp(1, -0.75, (t - 0.1) / 0.14);
      if (t < 0.6) return lerp(-0.75, 0.45, (t - 0.24) / 0.36);
      return 0.45 + Math.sin(worldTime * 4) * 0.1;
    }

    function drawWing(px, py, s, far) {
      ctx.save();
      ctx.translate(px, py);
      ctx.scale(0.9 + 0.1 * Math.abs(s), s);

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-6, -19);
      ctx.lineTo(-19, -22);
      ctx.lineTo(-31, -11);
      ctx.quadraticCurveTo(-25, -11, -22, -6);
      ctx.quadraticCurveTo(-16, -9, -12, -3);
      ctx.quadraticCurveTo(-7, -5, -3, 1);
      ctx.closePath();

      if (far) {
        ctx.fillStyle = "#130f19";
        ctx.fill();
      } else {
        const g = ctx.createLinearGradient(0, -22, 0, 0);
        g.addColorStop(0, "#4a3355");
        g.addColorStop(1, "#1e1626");
        ctx.fillStyle = g;
        ctx.fill();

        ctx.strokeStyle = "#5e4468";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-6, -19);
        ctx.lineTo(-19, -22);
        ctx.moveTo(-6, -19);
        ctx.lineTo(-31, -11);
        ctx.moveTo(-6, -19);
        ctx.lineTo(-22, -6);
        ctx.moveTo(-6, -19);
        ctx.lineTo(-12, -3);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawEye(ex, ey, w, h, blink, dead) {
      if (dead) {
        ctx.strokeStyle = "#d9b26a";
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(ex - w * 0.7, ey - h);
        ctx.lineTo(ex + w * 0.7, ey + h);
        ctx.moveTo(ex + w * 0.7, ey - h);
        ctx.lineTo(ex - w * 0.7, ey + h);
        ctx.stroke();
        return;
      }

      if (blink) {
        ctx.strokeStyle = "#0b080e";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(ex - w, ey);
        ctx.quadraticCurveTo(ex, ey + h, ex + w, ey);
        ctx.stroke();
        return;
      }

      ctx.save();
      ctx.shadowColor = "#f5c45a";
      ctx.shadowBlur = 7;
      const g = ctx.createRadialGradient(ex, ey, 0.5, ex, ey, w);
      g.addColorStop(0, "#fff0a6");
      g.addColorStop(1, "#e8a43c");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(ex - w, ey);
      ctx.quadraticCurveTo(ex, ey - h * 2, ex + w, ey);
      ctx.quadraticCurveTo(ex, ey + h * 2, ex - w, ey);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = "#0b080e";
      ctx.beginPath();
      ctx.ellipse(ex + 0.4, ey, w * 0.28, h * 0.95, 0, 0, TAU);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(ex + w * 0.35, ey - h * 0.45, 0.7, 0, TAU);
      ctx.fill();
    }

    function drawCat(x, y, velocity, opts = {}) {
      const dead = !!opts.dead;
      const flapT = opts.flapT ?? 1;
      const angle = dead ? opts.spin : clamp(velocity / 900, -0.42, 0.58);
      const tuck = dead ? 0.5 : clamp(velocity / 500, 0, 1);
      const sway = Math.sin(worldTime * 5) * 3;
      const blink = mod(worldTime, 3.7) < 0.12;
      const fur = "#16121b";

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      // Soft aura so the black cat reads against the night.
      const aura = ctx.createRadialGradient(4, -4, 4, 4, -4, 42);
      aura.addColorStop(0, "rgba(200, 120, 160, 0.22)");
      aura.addColorStop(1, "rgba(200, 120, 160, 0)");
      ctx.fillStyle = aura;
      ctx.beginPath();
      ctx.arc(4, -4, 42, 0, TAU);
      ctx.fill();

      const ws = dead ? -0.3 : wingScale(flapT);
      drawWing(1, -8, ws * 0.85, true);

      // Tail with a curled tip.
      ctx.strokeStyle = fur;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(-15, 2);
      ctx.bezierCurveTo(-28, 2 + sway * 0.3, -36, -8 + sway, -31, -19 + sway);
      ctx.stroke();
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.moveTo(-31, -19 + sway);
      ctx.quadraticCurveTo(-28, -26 + sway, -22, -24 + sway);
      ctx.stroke();
      ctx.strokeStyle = "rgba(214, 130, 150, 0.45)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-20, -1);
      ctx.bezierCurveTo(-29, -2 + sway * 0.3, -35, -10 + sway, -31, -21 + sway);
      ctx.stroke();

      // Far legs.
      ctx.strokeStyle = "#0e0b12";
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.moveTo(-5, 8);
      ctx.quadraticCurveTo(-10, 13 + tuck * 3, -14 - tuck * 2, 13 + tuck * 5);
      ctx.moveTo(12, 6);
      ctx.quadraticCurveTo(16, 11 + tuck * 3, 21 + tuck * 2, 12 + tuck * 4);
      ctx.stroke();

      // Body.
      const bodyGrad = ctx.createLinearGradient(0, -12, 0, 13);
      bodyGrad.addColorStop(0, "#2d2536");
      bodyGrad.addColorStop(1, "#110e15");
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.moveTo(14, -4);
      ctx.bezierCurveTo(6, -12, -10, -12, -18, -5);
      ctx.bezierCurveTo(-24, 0, -20, 12, -10, 12);
      ctx.bezierCurveTo(-2, 14, 8, 13, 13, 8);
      ctx.bezierCurveTo(17, 4, 17, 0, 14, -4);
      ctx.closePath();
      ctx.fill();

      // Haunch.
      ctx.beginPath();
      ctx.ellipse(-11, 3, 9, 8, -0.2, 0, TAU);
      ctx.fill();

      // Chest fluff.
      ctx.fillStyle = "#272030";
      ctx.beginPath();
      ctx.ellipse(11, 3, 5, 6.5, -0.2, 0, TAU);
      ctx.fill();

      // Moon rim light along the back.
      ctx.strokeStyle = "rgba(225, 140, 155, 0.6)";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(8, -9.5);
      ctx.bezierCurveTo(0, -12, -10, -11, -17, -5.5);
      ctx.stroke();

      // Near legs and paws.
      ctx.strokeStyle = fur;
      ctx.lineWidth = 5.5;
      const backPaw = [-19 - tuck * 2, 13 + tuck * 6];
      const frontPaw = [18 + tuck * 3, 15 + tuck * 4];
      ctx.beginPath();
      ctx.moveTo(-10, 8);
      ctx.quadraticCurveTo(-15, 14 + tuck * 3, backPaw[0], backPaw[1]);
      ctx.moveTo(8, 8);
      ctx.quadraticCurveTo(12, 14 + tuck * 3, frontPaw[0], frontPaw[1]);
      ctx.stroke();

      ctx.fillStyle = "#241d2b";
      for (const [px, py] of [backPaw, frontPaw]) {
        ctx.beginPath();
        ctx.ellipse(px, py, 3.4, 2.6, 0, 0, TAU);
        ctx.fill();
      }

      drawWing(1, -8, ws, false);

      // Collar and bell.
      ctx.strokeStyle = "#8c2f45";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(6, -6);
      ctx.quadraticCurveTo(10, 1, 18, -1);
      ctx.stroke();

      ctx.fillStyle = "#d9a441";
      ctx.beginPath();
      ctx.arc(12, 1.5, 2.5, 0, TAU);
      ctx.fill();
      ctx.fillStyle = "#fff1c4";
      ctx.beginPath();
      ctx.arc(11.3, 0.8, 0.8, 0, TAU);
      ctx.fill();

      // Far ear.
      ctx.fillStyle = "#120f17";
      ctx.beginPath();
      ctx.moveTo(8, -15);
      ctx.quadraticCurveTo(6, -24, 8, -29);
      ctx.quadraticCurveTo(13, -24, 15, -19);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#4e2a3a";
      ctx.beginPath();
      ctx.moveTo(9.5, -18);
      ctx.quadraticCurveTo(8.5, -23, 9.5, -26);
      ctx.quadraticCurveTo(12, -22, 13, -19);
      ctx.closePath();
      ctx.fill();

      // Head.
      const headGrad = ctx.createRadialGradient(19, -16, 1, 15, -11, 12);
      headGrad.addColorStop(0, "#352c3f");
      headGrad.addColorStop(1, "#15111a");
      ctx.fillStyle = headGrad;
      ctx.beginPath();
      ctx.arc(15, -11, 10.5, 0, TAU);
      ctx.fill();

      // Cheek fluff.
      ctx.beginPath();
      ctx.moveTo(7, -8);
      ctx.lineTo(6, -3);
      ctx.lineTo(9, -4);
      ctx.lineTo(10, -0.5);
      ctx.lineTo(13, -2.5);
      ctx.lineTo(17, -1);
      ctx.lineTo(20, -3);
      ctx.lineTo(24, -6);
      ctx.lineTo(20, -10);
      ctx.closePath();
      ctx.fill();

      // Near ear.
      ctx.fillStyle = "#1b1622";
      ctx.beginPath();
      ctx.moveTo(17, -19);
      ctx.quadraticCurveTo(24, -24, 27, -28);
      ctx.quadraticCurveTo(27, -20, 24, -13);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#7a4157";
      ctx.beginPath();
      ctx.moveTo(19.5, -18.5);
      ctx.quadraticCurveTo(23.5, -22, 25.5, -25);
      ctx.quadraticCurveTo(25.5, -20, 23.5, -15.5);
      ctx.closePath();
      ctx.fill();

      // Head rim light.
      ctx.strokeStyle = "rgba(225, 140, 155, 0.55)";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(15, -11, 10, -1.75, -0.35);
      ctx.stroke();

      // Eyes (three-quarter view).
      drawEye(12, -12, 2.3, 1.9, blink, dead);
      drawEye(19.5, -12, 3.1, 2.2, blink, dead);

      // Muzzle, nose and mouth.
      ctx.fillStyle = "#231c2a";
      ctx.beginPath();
      ctx.ellipse(23.5, -6.5, 4, 3, 0, 0, TAU);
      ctx.fill();

      ctx.fillStyle = "#d07a8a";
      ctx.beginPath();
      ctx.moveTo(25, -8.6);
      ctx.lineTo(28, -8.6);
      ctx.lineTo(26.5, -6.8);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#6a4a5a";
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(26.5, -6.8);
      ctx.lineTo(26.5, -5.6);
      ctx.quadraticCurveTo(25.5, -4.2, 24, -4.8);
      ctx.moveTo(26.5, -5.6);
      ctx.quadraticCurveTo(27.5, -4.2, 28.8, -5);
      ctx.stroke();

      // Whiskers.
      ctx.strokeStyle = "rgba(225, 205, 215, 0.6)";
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(25, -7);
      ctx.quadraticCurveTo(30, -10, 36, -10);
      ctx.moveTo(25, -6);
      ctx.quadraticCurveTo(31, -6.5, 37, -5);
      ctx.moveTo(25, -5);
      ctx.quadraticCurveTo(30, -3, 35, -0.5);
      ctx.stroke();

      ctx.restore();
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
        ctx.fillStyle = p.color;
        diamond(p.x, p.y, p.size);
      }
      ctx.globalAlpha = 1;
    }

    // ---------- UI ----------

    function drawVignette() {
      const v = ctx.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 470);
      v.addColorStop(0, "rgba(5, 3, 8, 0)");
      v.addColorStop(1, "rgba(5, 3, 8, 0.6)");
      ctx.fillStyle = v;
      ctx.fillRect(0, 0, W, H);
    }

    function drawPanel(x, y, width, height) {
      ctx.save();
      ctx.shadowColor = "rgba(0, 0, 0, 0.6)";
      ctx.shadowBlur = 30;
      ctx.shadowOffsetY = 10;
      roundedRect(x, y, width, height, 14);
      const g = ctx.createLinearGradient(0, y, 0, y + height);
      g.addColorStop(0, "rgba(38, 28, 48, 0.95)");
      g.addColorStop(1, "rgba(18, 13, 24, 0.95)");
      ctx.fillStyle = g;
      ctx.fill();
      ctx.restore();

      roundedRect(x, y, width, height, 14);
      ctx.strokeStyle = "#8a6474";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      roundedRect(x + 6, y + 6, width - 12, height - 12, 10);
      ctx.strokeStyle = "rgba(201, 140, 150, 0.22)";
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.fillStyle = "#c88a7a";
      for (const [cx, cy] of [[x + 6, y + 6], [x + width - 6, y + 6], [x + 6, y + height - 6], [x + width - 6, y + height - 6]]) {
        diamond(cx, cy, 3.5);
      }
    }

    function drawDivider(cx, y) {
      ctx.strokeStyle = "#8a6474";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx - 80, y);
      ctx.lineTo(cx - 12, y);
      ctx.moveTo(cx + 12, y);
      ctx.lineTo(cx + 80, y);
      ctx.stroke();
      ctx.fillStyle = "#d29380";
      diamond(cx, y, 4);
      ctx.fillStyle = "#8a6474";
      diamond(cx - 84, y, 2);
      diamond(cx + 84, y, 2);
    }

    function drawTitleText(text, x, y, size) {
      ctx.save();
      ctx.font = `bold ${size}px Georgia, serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const g = ctx.createLinearGradient(0, y - size / 2, 0, y + size / 2);
      g.addColorStop(0, "#fff0dc");
      g.addColorStop(1, "#e09a8a");
      ctx.shadowColor = "rgba(200, 80, 110, 0.7)";
      ctx.shadowBlur = 18;
      ctx.fillStyle = g;
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    function drawLabel(text, x, y, font, color, spacing = 0) {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = font;
      ctx.fillStyle = color;
      setSpacing(spacing);
      ctx.fillText(text, x, y);
      setSpacing(0);
    }

    function drawButton(rect, label, enabled = true) {
      const { x, y, w, h } = rect;
      const hover = enabled && pointer.inside && inRect(pointer, rect);
      const pulse = enabled ? Math.sin(worldTime * 3) * 0.5 + 0.5 : 0;

      ctx.save();
      ctx.globalAlpha *= enabled ? 1 : 0.45;
      ctx.shadowColor = "rgba(200, 80, 110, 0.8)";
      ctx.shadowBlur = hover ? 22 : 8 + pulse * 8;

      roundedRect(x, y, w, h, 10);
      const g = ctx.createLinearGradient(0, y, 0, y + h);
      g.addColorStop(0, hover ? "#bb5068" : "#9e3e57");
      g.addColorStop(1, hover ? "#842f48" : "#6a2339");
      ctx.fillStyle = g;
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha *= enabled ? 1 : 0.45;
      roundedRect(x, y, w, h, 10);
      ctx.strokeStyle = "#e3a3a3";
      ctx.lineWidth = 1.2;
      ctx.stroke();

      ctx.strokeStyle = "rgba(255, 220, 220, 0.25)";
      ctx.beginPath();
      ctx.moveTo(x + 10, y + 3);
      ctx.lineTo(x + w - 10, y + 3);
      ctx.stroke();

      drawLabel(label, x + w / 2, y + h / 2 + 1, "bold 16px Georgia, serif", "#fbeede", 3);
      ctx.restore();
    }

    function drawMenu() {
      ctx.fillStyle = "rgba(8, 5, 12, 0.25)";
      ctx.fillRect(0, 0, W, H);

      drawPanel(40, 130, 340, 360);

      drawLabel("A GOTHIC LITTLE ADVENTURE", W / 2, 162, "12px Georgia, serif", "#c98a8c", 3);
      drawTitleText("Midnight", W / 2, 206, 40);
      drawTitleText("Familiar", W / 2, 248, 40);
      drawDivider(W / 2, 282);

      drawCat(W / 2 + 2, 330 + Math.sin(worldTime * 2.6) * 4, 0, { flapT: mod(worldTime, 0.9) });

      drawButton(MENU_BUTTON, "BEGIN");

      drawLabel("Click, tap, or press Space to fly", W / 2, 442, "italic 13px Georgia, serif", "#b6a8b2");
      drawLabel(`BEST FLIGHT  ${best}   ·   M TO MUTE`, W / 2, 468, "11px Georgia, serif", "#a58c9b", 2);
    }

    function rankFor(value) {
      if (value < 5) return "Fledgling";
      if (value < 15) return "Night Prowler";
      if (value < 30) return "Shadow Stalker";
      if (value < 50) return "Crypt Keeper";
      return "Moon Sovereign";
    }

    function drawStatBox(x, y, w, h, label, value, highlight) {
      roundedRect(x, y, w, h, 8);
      ctx.fillStyle = "rgba(10, 7, 14, 0.55)";
      ctx.fill();
      ctx.strokeStyle = highlight ? "#d9a441" : "rgba(160, 110, 130, 0.5)";
      ctx.lineWidth = 1;
      ctx.stroke();

      drawLabel(label, x + w / 2, y + 18, "11px Georgia, serif", "#a58c9b", 3);
      drawLabel(String(value), x + w / 2, y + 48, "bold 30px Georgia, serif", highlight ? "#f2c46b" : "#f0dfc9");
    }

    function drawGameOver() {
      const a = clamp((overTime - 0.45) / 0.35, 0, 1);
      if (a <= 0) return;

      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = "rgba(8, 5, 12, 0.4)";
      ctx.fillRect(0, 0, W, H);
      ctx.translate(0, (1 - a) * 24);

      drawPanel(40, 140, 340, 340);

      drawLabel("THE NIGHT CLAIMS ANOTHER", W / 2, 172, "12px Georgia, serif", "#c98a8c", 3);
      drawTitleText("Flight's Over", W / 2, 210, 34);

      drawStatBox(64, 238, 140, 76, "SCORE", score, false);
      drawStatBox(216, 238, 140, 76, "BEST", best, newBest);

      if (newBest) {
        const tx = 356;
        const ty = 238;
        roundedRect(tx - 34, ty - 9, 44, 18, 9);
        ctx.fillStyle = "#d9a441";
        ctx.fill();
        drawLabel("NEW", tx - 12, ty + 0.5, "bold 10px Georgia, serif", "#2a1a10", 2);
      }

      drawLabel(`Rank: ${rankFor(score)}`, W / 2, 342, "italic 16px Georgia, serif", "#d6c2c8");

      drawButton(OVER_BUTTON, "TRY AGAIN", overTime > 0.8);
      drawLabel("Click, tap, or press Space", W / 2, 446, "italic 12px Georgia, serif", "#a8979f");

      ctx.restore();
    }

    function drawHUD() {
      const s = 1 + scorePop * 0.35;

      ctx.save();
      ctx.translate(W / 2, 54);
      ctx.scale(s, s);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "bold 44px Georgia, serif";
      ctx.lineWidth = 7;
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#140f1a";
      ctx.strokeText(score, 0, 0);
      const g = ctx.createLinearGradient(0, -20, 0, 20);
      g.addColorStop(0, "#fff0dc");
      g.addColorStop(1, scorePop > 0 ? "#f2c46b" : "#e0a48f");
      ctx.fillStyle = g;
      ctx.fillText(score, 0, 0);
      ctx.restore();

      // Pause button.
      const b = PAUSE_BUTTON;
      const hover = pointer.inside && inRect(pointer, b);
      roundedRect(b.x, b.y, b.w, b.h, 8);
      ctx.fillStyle = hover ? "rgba(60, 40, 70, 0.8)" : "rgba(20, 15, 26, 0.6)";
      ctx.fill();
      ctx.strokeStyle = "rgba(200, 140, 150, 0.5)";
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = "#f0dfc9";
      ctx.fillRect(b.x + 11, b.y + 10, 3.5, 12);
      ctx.fillRect(b.x + 18, b.y + 10, 3.5, 12);
    }

    function drawPaused() {
      ctx.fillStyle = "rgba(8, 5, 12, 0.55)";
      ctx.fillRect(0, 0, W, H);
      drawPanel(80, 250, 260, 130);
      drawTitleText("Paused", W / 2, 296, 34);
      drawLabel("Tap or press P to resume", W / 2, 340, "italic 13px Georgia, serif", "#b6a8b2");
    }

    function drawMuteButton() {
      const b = MUTE_BUTTON;
      const hover = pointer.inside && inRect(pointer, b);
      roundedRect(b.x, b.y, b.w, b.h, 8);
      ctx.fillStyle = hover ? "rgba(60, 40, 70, 0.8)" : "rgba(20, 15, 26, 0.6)";
      ctx.fill();
      ctx.strokeStyle = "rgba(200, 140, 150, 0.5)";
      ctx.lineWidth = 1;
      ctx.stroke();

      const cx = b.x + 9;
      const cy = b.y + b.h / 2;
      ctx.fillStyle = "#f0dfc9";
      ctx.beginPath();
      ctx.moveTo(cx, cy - 3.5);
      ctx.lineTo(cx + 4, cy - 3.5);
      ctx.lineTo(cx + 9, cy - 8);
      ctx.lineTo(cx + 9, cy + 8);
      ctx.lineTo(cx + 4, cy + 3.5);
      ctx.lineTo(cx, cy + 3.5);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#f0dfc9";
      ctx.lineWidth = 1.6;
      ctx.lineCap = "round";
      ctx.beginPath();
      if (sound.muted) {
        ctx.moveTo(cx + 12, cy - 4);
        ctx.lineTo(cx + 18, cy + 4);
        ctx.moveTo(cx + 18, cy - 4);
        ctx.lineTo(cx + 12, cy + 4);
      } else {
        ctx.arc(cx + 10, cy, 4, -0.9, 0.9);
        ctx.moveTo(cx + 10 + 7.5 * Math.cos(-0.9), cy + 7.5 * Math.sin(-0.9));
        ctx.arc(cx + 10, cy, 7.5, -0.9, 0.9);
      }
      ctx.stroke();
    }

    function updateCursor() {
      let interactive = false;
      if (pointer.inside) {
        if (inRect(pointer, MUTE_BUTTON)) interactive = true;
        else if (state === "menu") interactive = true;
        else if (state === "over") interactive = overTime > 0.8;
        else if (state === "paused") interactive = true;
        else if (state === "playing") interactive = inRect(pointer, PAUSE_BUTTON);
      }
      canvas.style.cursor = interactive ? "pointer" : "default";
    }

    // ---------- Frame ----------

    function draw() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      ctx.save();
      if (shake > 0) {
        const m = shake * 18;
        ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
      }

      drawBackground();
      drawPillars();
      drawGround();
      drawParticles();

      if (state !== "menu") {
        drawCat(cat.x, cat.y, cat.velocity, {
          flapT: cat.flapT,
          dead: state === "over",
          spin: cat.spin
        });
      }

      drawVignette();
      ctx.restore();

      if (flash > 0) {
        ctx.fillStyle = `rgba(255, 210, 210, ${flash * 0.5})`;
        ctx.fillRect(0, 0, W, H);
      }

      if (state === "menu") drawMenu();
      else if (state === "playing") drawHUD();
      else if (state === "paused") {
        drawHUD();
        drawPaused();
      } else if (state === "over") drawGameOver();

      drawMuteButton();
      updateCursor();
    }

    function loop(timestamp) {
      const dt = lastTime
        ? Math.min((timestamp - lastTime) / 1000, 0.032)
        : 0;
      lastTime = timestamp;

      update(dt);
      setMood(state);
      draw();
      requestAnimationFrame(loop);
    }

    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
